<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAND BATTLE LIVE</title>
<meta name="description" content="TikTok LIVE interactive physics battle game">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>

  <aside id="panel">
    <header>
      <h1>LAND BATTLE LIVE</h1>
      <p class="hint">Туршилтын самбар · <kbd>H</kbd> нуух · OBS/LIVE Studio-д <code>?overlay=1</code></p>
    </header>

    <section>
      <h2>TikTok LIVE холболт</h2>
      <div class="row">
        <input id="wsUrl" value="ws://localhost:8787" spellcheck="false">
        <button id="wsConnect">Холбох</button>
      </div>
      <div id="wsStatus" class="status off">Холбогдоогүй (симуляц горим)</div>
    </section>

    <section>
      <h2>Үйлдэл дуурайх</h2>
      <div class="row">
        <input id="simUser" placeholder="хэрэглэгчийн нэр" value="bataa_99" spellcheck="false">
        <button id="simRandom" title="Санамсаргүй нэр">🎲</button>
      </div>
      <div class="grid">
        <button data-act="follow">➕ Follow</button>
        <button data-act="like1">❤️ Like</button>
        <button data-act="like15">❤️ Like ×15</button>
        <button data-act="rose">🌹 Rose (1💎)</button>
        <button data-act="small">💝 Heart Me (5💎)</button>
        <button data-act="small2">🍩 Doughnut (30💎)</button>
        <button data-act="big">🦁 Lion (100💎+)</button>
        <button data-act="huge">🌌 Galaxy (1000💎)</button>
      </div>
      <div class="row">
        <input id="simComment" placeholder="Comment: !join, !stats ..." spellcheck="false">
        <button id="simSend">Илгээх</button>
      </div>
    </section>

    <section>
      <h2>Тест</h2>
      <div class="grid">
        <button id="addBots">🤖 +10 бот</button>
        <button id="autoSim" class="toggle">▶ Авто симуляц</button>
        <button id="forceEnd">⏹ Раунд дуусгах</button>
        <button id="resetAll">♻ Бүгдийг цэвэрлэх</button>
      </div>
    </section>

    <section>
      <h2>Баланс тохиргоо</h2>
      <div id="balance" class="balance"></div>
      <div class="row">
        <button id="balSave">Хадгалах</button>
        <button id="balReset">Анхны утга</button>
      </div>
    </section>
  </aside>
</div>
<script src="game.js"></script>
</body>
</html>
